services:
  battle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokepedia-battle
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      BATTLE_ALLOWED_ORIGINS: ${BATTLE_ALLOWED_ORIGINS:-http://localhost:1513}
      # The API runs in its own compose project, so reach it through the host.
      POKEPEDIA_API_URL: ${POKEPEDIA_API_URL:-http://host.docker.internal:8080/api/v1}
      # Where the browser loads Showdown sprites from (PokePedia's image store).
      SHOWDOWN_SPRITES_DOMAIN: ${SHOWDOWN_SPRITES_DOMAIN:-localhost:9000/pokemon-images/showdown}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
